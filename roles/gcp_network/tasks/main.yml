---
- name: Validate network configuration
  ansible.builtin.assert:
    that:
      - gcp_network_project | length > 0
      - gcp_network_vpc.name | length > 0
      - gcp_network_vpc.routing_mode in ['REGIONAL', 'GLOBAL']
      - gcp_network_subnets | length > 0
      - >-
        (gcp_network_subnets | map(attribute='name') | unique | list | length)
        == (gcp_network_subnets | length)
    fail_msg: Invalid or missing GCP network configuration.

- name: Ensure VPC network exists
  google.cloud.gcp_compute_network:
    name: "{{ gcp_network_vpc.name }}"
    project: "{{ gcp_network_project }}"
    auto_create_subnetworks: "{{ gcp_network_vpc.auto_create_subnetworks }}"
    routing_config:
      routing_mode: "{{ gcp_network_vpc.routing_mode }}"
    auth_kind: application
    state: present
  register: gcp_network_result

- name: Ensure configured subnetworks exist
  google.cloud.gcp_compute_subnetwork:
    name: "{{ item.name }}"
    project: "{{ gcp_network_project }}"
    region: "{{ item.region | default(gcp_network_region) }}"
    network: "{{ gcp_network_result }}"
    ip_cidr_range: "{{ item.cidr }}"
    private_ip_google_access: "{{ item.private_google_access }}"
    auth_kind: application
    state: present
  loop: "{{ gcp_network_subnets }}"
  loop_control:
    label: "{{ item.name }}"
