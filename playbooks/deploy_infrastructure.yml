---
- name: Deploy GCP infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../inventories/dev/group_vars/all.yml

  roles:
    - role: gcp_network
      vars:
        gcp_network_project: "{{ gcp_project }}"
        gcp_network_region: "{{ gcp_region }}"
        gcp_network_vpc: "{{ network }}"
        gcp_network_subnets: "{{ subnets }}"
      tags:
        - networking
